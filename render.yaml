services:
  - type: web
    name: prava-financial-cloud
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      # Required: the server will not start without a production database.
      - key: DATABASE_URL
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
      # Gmail API over HTTPS is the default channel: Render Free drops outbound
      # SMTP on ports 25/465/587, but 443 is always open. All mail is sent as
      # ambole.rajesh@gmail.com; omambole2007@gmail.com is the admin login only.
      - key: EMAIL_PROVIDER
        value: gmail_api
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        value: ambole.rajesh@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: prava-documents
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_LOGIN_PASSWORD
        sync: false
      # Comma-separated emails promoted to the admin role at startup. Only
      # accounts that already exist are promoted; no account is ever created.
      - key: ADMIN_EMAILS
        value: omambole2007@gmail.com
